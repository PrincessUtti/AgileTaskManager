<!DOCTYPE html>
<html lang="en">

  <head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, inital-scale=1.0"> 
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <title>
      Calendar
    </title>

  </head>

  

  <body>

    <header class="header"><div id="nav-placeholder"></div></header>

    <main>
      <div class="calendar">
        
        <div class="header">
          <button id="prevBtn">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <div class="monthYear" id="monthYear"></div>
          <button id="nextBtn">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

        <div class="days">
          <div class="day">Monday</div>
          <div class="day">Tuesday</div>
          <div class="day">Wednesday</div>
          <div class="day">Thursday</div>
          <div class="day">Friday</div>
          <div class="day">Saturday</div>
          <div class="day">Sunday</div>
        </div>

        <div class="dates" id="dates"></div>

        <div id="taskBox"></div>

        <div id="popup" class="popup">
          <form id="editForm" method="POST">
            <input type="text" name="title" placeholder="Task Name">
            <br></br>
            <input type="text" name="description" placeholder="Task Description">
            <br></br>
            <input type="date" name="due_date" placeholder="Task Due Date">
            <br></br>
            <input type="time" name="time" placeholder="Task Time">
            <br></br>

            
            <select name="completion_level">
                <option value="" disabled selected>Select Status</option>
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
                <option value="On Hold">Needs Further Work</option>
            </select>
            <br></br>
            
            
            <select name="set_priority">
                <option value="" disabled selected>Select Priority</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
            </select>
            <br></br>
            <button type="submit">Save</button>
            <button type="button" onclick="closePopup()">Cancel</button>
          </form>
        </div>
      </div>
    </main>

    <!--script src="{{ url_for('static', filename='script.js') }}"></script>-->
    <script src="{{url_for('static', filename='script.js')}}">
    </script>
    <script>initCalendar();</script>

    <script src="{{url_for('static', filename='script.js')}}"></script>

    <script>
      navBar("nav-placeholder")
    </script>
  </body>
</html>
