<!DOCTYPE html>

<head>
  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, inital-scale=1.0"> 
  
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <title>Backlog</title>

</head>

<body>    
    <header class="header"><div id="nav-placeholder"></div></header>

    <div class="container">
        <button type="submit" class="btn" onclick="openPopup()"> Add Task </button>
        <div class="popup" id="popup">
            <h2> Add New Task</h2>
            <button type="button" onclick="closePopup()" style="background-color: #f44336; color: white; border: none; padding: 10px 20px; cursor: pointer;"> X </button>
            <form action="/add_task" method="POST">
                <input type="text" name="task_name" placeholder="Task Name" required>
                <br></br>
                <input type="text" name="task_description" placeholder="Task Description" required>
                <br></br>
                <input type="date" name="task_due_date" placeholder="Task Due Date" required>
                <br></br>
                <input type="time" name="task_time" placeholder="Task Time" required>
                <br></br>

                
                <select name="task_status" required>
                    <option value="" disabled selected>Select Status</option>
                    <option value="Not Started">Not Started</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                    <option value="On Hold">Needs Further Work</option>
                </select>
                <br></br>
                
                
                <select name="task_priority" required>
                    <option value="" disabled selected>Select Priority</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
                <br></br>
                
                <input type="number" name="task_tokens" placeholder="Task Tokens (Default: 1)" min="1" value="1"> <!--required>
                <br></br>


                <!-- Subtasks Section -->

                <div class="subtasks-section">
                    <h3>Subtasks (Optional)</h3>
                    <div id="subtasks-container"></div>
                    <button type="button" onclick="addSubtask()">Add Subtask</button> <!--class="add-subtask-btn"-->
                </div>
                <br></br>
                
                <button type="submit" onclick="closePopup()">OK</button>
                <!--button type="button" onclick="closePopup()">Close</button-->

            </form>
            <p> You task has been successfully added </p>
        </div>

    
    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>


    <script src="{{url_for('static', filename='script.js')}}"></script>

    <script>
      navBar("nav-placeholder")
    </script>

    <script>
        function addSubtask() {
            const subtasksContainer = document.getElementById("subtasks-container");
            const subtaskRow = document.createElement("div");
            subtaskRow.className = 'subtask-row';
            //subtaskRow.classList.add('subtask-row');
            subtaskRow.innerHTML = `
                <input type="text" name="subtask_title[]" placeholder="Subtask Name" required>
                <input type="number" name="subtask_tokens[]" placeholder="Subtask Tokens" min="1" value="1" required>
                <button type="button" class="remove-subtask-btn" onclick="this.parentElement.remove()">Remove</button>
            `;
            subtasksContainer.appendChild(subtaskRow);
        }
    </script>
</body>


</html>
